[package]
categories = ["embedded", "no-std"]
description = "Host side of the NFC Forum NCI 2.x protocol on embedded-hal: packets, RF types and the I2C link, shared by NFC controller drivers"
edition = "2021"
exclude = [".github"]
keywords = ["no-std", "nfc", "nci", "embedded-hal"]
license = "MIT OR Apache-2.0"
name = "nfc-nci"
repository = "https://github.com/georgesFoundation/nfc-nci"
# MSRV-aware dependency resolution, so the 1.87 CI job resolves versions it can build.
resolver = "3"
rust-version = "1.87.0"
version = "0.1.0"

[features]
default = []
# Enable use of the `alloc` crate.
alloc = []
# Enable use of the Rust standard library. Implies `alloc`.
std = ["alloc"]

[dependencies]
derive_more = { version = "1.0", features = ["from"], default-features = false }
embedded-hal = { version = "1.0" }
heapless = { version = "0.9" }

[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = ["eh1"] }
